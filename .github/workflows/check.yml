name: Check for new courses
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python check.py
        env:
          PAGE_URL: ${{ secrets.PAGE_URL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASS: ${{ secrets.SITE_PASS }}
          USER_FIELD: ${{ secrets.USER_FIELD }}
          PASS_FIELD: ${{ secrets.PASS_FIELD }}
          SELECTOR: ${{ secrets.SELECTOR }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "notifier-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
